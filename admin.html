<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Boggle · Admin</title><style>
body{font:17px system-ui;background:#f6f2e9;color:#292923;margin:0;padding:24px}main{max-width:650px;margin:auto}section{background:white;border-radius:18px;padding:22px;margin:20px 0}input,select,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin:8px 0;border:1px solid #bbb;border-radius:10px}button{background:#315947;color:white;cursor:pointer}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #ddd}#status{white-space:pre-wrap}a{color:#315947}small{display:block;line-height:1.5}</style><main><a href="/">← Back to Boggle</a><h1>Player admin</h1><section id="login"><form id="auth"><label>Admin password<input id="password" type="password" autocomplete="current-password" required></label><button>Unlock</button></form></section><section id="tools" hidden><button id="backup">Download full data backup</button><button id="refresh">Refresh players</button><label>Room<select id="room"></select></label><label>Duplicate to merge<select id="source"></select></label><label>Profile to keep<select id="target"></select></label><div id="preview"></div><p><small>Totals are added; best records are kept. Past rounds shared by both names cannot be deduplicated automatically. Both original records are archived with the saved stats. Future scores under the old name go to the retained profile.</small></p><label><input id="confirm" type="checkbox" style="width:auto"> I reviewed these records and want to merge them.</label><button id="merge" disabled>Merge players</button><button id="lock">Lock admin</button></section><p id="status" role="status"></p></main><script src="/admin.js"></script></html>
